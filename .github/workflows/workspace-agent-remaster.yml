name: Workspace agent remaster checks

on:
  workflow_dispatch:
  push:
    branches:
      - agent/full-remaster-workspace-first
  pull_request:
    branches:
      - agent/workspace-foundation

jobs:
  workspace-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bridge dependencies
        run: python -m pip install websockets

      - name: Compile Python sources
        run: python -m py_compile bridge.py workspace_agent/tools.py workspace_agent/test_tools.py workspace_agent/test_bridge.py

      - name: Run workspace unit tests
        run: python -m unittest workspace_agent.test_tools workspace_agent.test_bridge -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check extension JavaScript syntax
        run: |
          node --check zeroscript-extension/core/config.js
          node zeroscript-extension/core/config.test.cjs
          node --check zeroscript-extension/core/parser.js
          node --check zeroscript-extension/core/main.js
          node --check zeroscript-extension/background.js
          node --check zeroscript-extension/popup.js
          node --check zeroscript-extension/workspace.js

      - name: Validate extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('zeroscript-extension/manifest.json', 'utf8'))"
